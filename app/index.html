<!doctype html>

<html><head><meta charset="utf-8"><title>Home</title>
<meta name="viewport" content="width=1920">
<style>
/* Built for a weak TV GPU: only transform and opacity ever animate; no blur, masks or filters. Everything a theme changes (manager > Theme) is a
   variable here; the service works the values out (helper/theme.js) and the defaults below are the original look. */
:root {
  --ink: #f5f6f8;
  --ink2: rgba(245, 246, 248, 0.62);
  --night: #07080b;
  --night-rgb: 7, 8, 11;
  --panel: #14161b;
  --panel2: #1a1c22;
  --acc: #f5f6f8;
  --acc-ink: #0b0c10;
  --focus: #f5f6f8;
  --font: "LG Smart UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --fs: 1;
  --spd: 1;
  --glow-op: 1;
  --wall: none;
  --pill-bg: rgba(255, 255, 255, 0.09);
  --pill-ring: rgba(255, 255, 255, 0.1);
  --pill-r: 32px;
  --pill-h: 64px;
  --bar-gap: 16px;
  --menu-bg: rgba(5, 6, 9, 0.97);
  --row-r: 30px;
  --clock-l: 96px;
  --clock-r: auto;
  --clock-t: 54px;
  --clock-b: auto;
  --clock-tx: none;
  --clock-ai: flex-start;
  --clock-s: 1;
  --date-s: 1;
  --clock-d: flex;
  --date-d: block;
  --bar-l: auto;
  --bar-r: 96px;
  --bar-t: 54px;
  --bar-b: auto;
  --bar-tx: none;
  --bar-d: flex;
  --rail-d: none;
  --rail-w: 128px;
  --rail-s: 72px;
  --rail-gap: 28px;
  --rail-bg: none;
  --name-d: block;
  --name-x: 96px;
  --name-y: 150px;
  --name-a: left;
  --name-s: 1;
  --view-top: 300px;
  --dock-l: 96px;
  --dock-r: auto;
  --dock-t: 60px;
  --dock-b: auto;
  --dock-tx: none;
  --dock-w: 408px;
  --dock-h: 230px;
  --dock-gap: 32px;
  --dock-rad: 36px;
  --dock-panel: 0;
  --dock-pad: 0px;
  --dock-lift: -10px;
  --dock-fs: 1.05;
  --cols: 10;
  --tile-w: 151px;
  --tile-h: 151px;
  --gap-x: 24px;
  --gap-y: 26px;
  --tile-r: 34px;
  --grid-l: 96px;
  --grid-w: 1728px;
  --grid-t: 350px;
  --grid-fs: 1.12;
  --ov-dim: 0.95;
  --gloss: 0;
  --tile-border: 0;
  --ring-w: 4px;
  --ring-off: 4px;
}
* {
  box-sizing: border-box;
  margin: 0;
}
html,
body {
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: var(--night);
  color: var(--ink);
  font-family: var(--font);
}
body {
  background-image: var(--wall);
  background-size: 1920px 1080px;
}
::selection {
  background: rgba(255, 255, 255, 0.25);
}

.glow {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 720px;
  opacity: 0;
  transition: opacity calc(0.35s * var(--spd)) linear;
  will-change: opacity;
  background: radial-gradient(ellipse 1400px 640px at 26% -6%, rgba(var(--c), 0.45), transparent 70%);
}
.glow.on {
  opacity: var(--glow-op);
}

/* a trailer behind the home screen (manager > Trailers): the picture first, the video over it once it plays; darkened towards the
   bottom and the left so the apps stay readable */
#trl {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  z-index: 1;
  pointer-events: none;
  opacity: 0;
  transition: opacity calc(0.8s * var(--spd)) ease;
  will-change: opacity;
}
#trl.on {
  opacity: 1;
}
#trl-bd,
#trl iframe {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  border: 0;
  background-size: cover;
  background-position: center;
}
#trl iframe {
  opacity: 0;
  transition: opacity calc(0.8s * var(--spd)) ease;
}
#trl iframe.on {
  opacity: 1;
}
#trl::after {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  background: linear-gradient(to top, rgba(var(--night-rgb), 0.92), rgba(var(--night-rgb), 0) 45%),
    linear-gradient(to right, rgba(var(--night-rgb), 0.85), rgba(var(--night-rgb), 0.35) 40%, rgba(var(--night-rgb), 0) 65%);
  transition: opacity calc(0.8s * var(--spd)) ease;
  will-change: opacity;
}
/* while the video plays (trailers.js adds .play): the title and the description go and the shade lightens, so the video is seen */
#trl.play::after {
  opacity: 0.4;
}
/* the title and its description take the place of the app name: from the grid's left edge, at the name's height (shelf.y) */
#trl-txt {
  position: absolute;
  left: var(--grid-l);
  top: var(--name-y);
  z-index: 1;
  width: 860px;
  text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6);
  transition: opacity calc(0.5s * var(--spd)) ease;
}
#trl.play #trl-txt {
  opacity: 0;
}
#trl-t {
  font-size: calc(68px * var(--fs));
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.1;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
}
#trl-o {
  margin-top: 20px;
  font-size: calc(28px * var(--fs));
  line-height: 1.4;
  color: rgba(255, 255, 255, 0.86);
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  overflow: hidden;
}
#shelf {
  transition: opacity calc(0.3s * var(--spd)) ease;
}
.hero #shelf {
  opacity: 0;
}
/* an app without films (YouTube): its logo, large, in the middle above the apps */
#trl-logo {
  display: none;
  position: absolute;
  left: 50%;
  top: 200px;
  width: 340px;
  height: 340px;
  margin-left: -170px;
  z-index: 1;
  border-radius: 48px;
  object-fit: contain;
}
#trl.logo #trl-logo {
  display: block;
}
#trl.logo #trl-txt {
  display: none;
}

/* the Mode screens: above everything, any key ends them */
#mode {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  z-index: 80;
  background: #000;
  overflow: hidden;
}
#mode .mph {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transition: opacity calc(2s * var(--spd)) ease;
}
#mode .mph.on {
  opacity: 1;
}
/* your own photos: whole, on black; a photo the phone held upright is turned (older TV browsers ignore the EXIF orientation) */
#mode.mine .mph {
  background-size: contain;
  background-repeat: no-repeat;
}
#mode.mine .mph.side {
  left: 420px;
  top: -420px;
  width: 1080px;
  height: 1920px;
}
/* the evening light: a warm base, three soft lights drifting, and a dark layer whose opacity sets how much light the room gets */
#mode .lb0,
#mode .ldim {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
}
#mode .ldim {
  background: #000;
  transition: opacity calc(0.6s * var(--spd)) ease;
}
#mode.light .blob {
  opacity: 0.85;
}
#mode .lhint {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 60px;
  text-align: center;
  font-size: 26px;
  color: rgba(255, 255, 255, 0.45);
  transition: opacity calc(1s * var(--spd)) ease;
}
#mode .lhint.gone {
  opacity: 0;
}
/* the evening light's clock: in the middle of the screen, still, in a rounded face (clockfont.css) */
#mode .mclk.small {
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
#mode .mclk.small .mt {
  font-family: "CYTV Clock", var(--font);
  font-weight: 600;
  font-size: 97px;
  letter-spacing: 0;
  font-variant-numeric: tabular-nums;
  color: rgba(255, 255, 255, 0.4);
}
#mode .mclk.small .md {
  font-size: 24px;
  color: rgba(255, 255, 255, 0.3);
}
#mode .mcap {
  position: absolute;
  left: 60px;
  bottom: 36px;
  max-width: 1500px;
  font-size: 20px;
  color: rgba(255, 255, 255, 0.7);
  text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#mode .mclk {
  position: absolute;
  left: 200px;
  top: 200px;
  transition: transform calc(3s * var(--spd)) ease;
}
#mode .mt {
  font-size: 150px;
  font-weight: 300;
  letter-spacing: -0.03em;
  line-height: 1;
  color: rgba(255, 255, 255, 0.82);
}
#mode .md {
  margin-top: 12px;
  font-size: 40px;
  color: rgba(255, 255, 255, 0.55);
}
#mode .blob {
  position: absolute;
  width: 1100px;
  height: 1100px;
  border-radius: 50%;
  opacity: 0.55;
  will-change: transform;
}
#mode .b1 {
  left: -200px;
  top: -300px;
  background: radial-gradient(closest-side, rgba(40, 90, 160, 0.9), rgba(40, 90, 160, 0));
  animation: drift1 calc(60s / var(--spd)) ease-in-out infinite alternate;
}
#mode .b2 {
  left: 900px;
  top: 200px;
  background: radial-gradient(closest-side, rgba(150, 60, 120, 0.8), rgba(150, 60, 120, 0));
  animation: drift2 calc(75s / var(--spd)) ease-in-out infinite alternate;
}
#mode .b3 {
  left: 300px;
  top: 500px;
  background: radial-gradient(closest-side, rgba(30, 140, 120, 0.7), rgba(30, 140, 120, 0));
  animation: drift1 calc(90s / var(--spd)) ease-in-out infinite alternate-reverse;
}
@keyframes drift1 {
  from {
    transform: translate(0, 0) scale(1);
  }
  to {
    transform: translate(500px, 250px) scale(1.25);
  }
}
@keyframes drift2 {
  from {
    transform: translate(0, 0) scale(1.1);
  }
  to {
    transform: translate(-600px, -200px) scale(0.9);
  }
}

/* naming an input: the TV's keyboard comes up for the field */
#ren {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  z-index: 70;
  background: var(--menu-bg);
}
#ren .panel {
  position: absolute;
  left: 560px;
  top: 220px;
  width: 800px;
}
#ren h2 {
  margin: 0 0 30px;
  font-size: calc(44px * var(--fs));
}
#ren input {
  width: 100%;
  box-sizing: border-box;
  padding: 22px 28px;
  font: inherit;
  font-size: calc(40px * var(--fs));
  color: var(--ink);
  background: var(--panel2);
  border: 3px solid var(--focus);
  border-radius: var(--row-r);
  outline: none;
}
#ren p {
  margin-top: 24px;
  font-size: calc(24px * var(--fs));
  color: var(--ink2);
}

#top {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  z-index: 5;
  pointer-events: none;
}
#clock {
  position: absolute;
  left: var(--clock-l);
  right: var(--clock-r);
  top: var(--clock-t);
  bottom: var(--clock-b);
  transform: var(--clock-tx);
  display: var(--clock-d);
  align-items: center;
  height: 76px;
}
#time {
  font-size: calc(56px * var(--fs) * var(--clock-s));
  font-weight: 600;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
#date {
  display: var(--date-d);
  font-size: calc(28px * var(--fs) * var(--date-s));
  color: rgba(245, 246, 248, 0.88);
  margin-left: 22px;
  padding-top: 14px;
}
[data-clock="stack"] #clock {
  flex-direction: column;
  align-items: var(--clock-ai);
  height: auto;
}
[data-clock="stack"] #date {
  margin: 8px 0 0 6px;
  padding: 0;
}
#bar {
  pointer-events: auto;
  position: absolute;
  left: var(--bar-l);
  right: var(--bar-r);
  top: var(--bar-t);
  bottom: var(--bar-b);
  transform: var(--bar-tx);
  display: var(--bar-d);
  align-items: center;
  height: calc(var(--pill-h) + 12px);
}
#bar > * + * {
  margin-left: var(--bar-gap);
}
.pill {
  display: flex;
  align-items: center;
  height: var(--pill-h);
  padding: 0 30px 0 24px;
  border-radius: var(--pill-r);
  font-size: calc(26px * var(--fs));
  font-weight: 500;
  background: var(--pill-bg);
  box-shadow: inset 0 0 0 1px var(--pill-ring);
  transition: transform calc(0.12s * var(--spd)) cubic-bezier(0.3, 1.35, 0.5, 1);
  will-change: transform;
}
.pill > * + * {
  margin-left: 14px;
}
.pill svg {
  width: 30px;
  height: 30px;
  flex: none;
}
.pill span {
  white-space: nowrap;
}
.pill.f {
  background: var(--acc);
  color: var(--acc-ink);
  transform: scale(1.07);
}
[data-bar="round"] .pill {
  width: var(--pill-h);
  padding: 0;
  justify-content: center;
}
[data-bar="flat"] .pill {
  background: none;
  box-shadow: none;
}
[data-labels="hide"] .pill span {
  display: none;
}
/* the strip along the left edge (theme rail.show): round icon buttons, centred top to bottom */
#rail {
  pointer-events: auto;
  position: absolute;
  left: 0;
  top: 0;
  width: var(--rail-w);
  height: 1080px;
  display: var(--rail-d);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--rail-bg);
  box-shadow: inset -1px 0 0 var(--pill-ring);
}
#rail > * + * {
  margin-top: var(--rail-gap);
}
.rb {
  display: flex;
  align-items: center;
  justify-content: center;
  width: var(--rail-s);
  height: var(--rail-s);
  border-radius: 50%;
  background: var(--pill-bg);
  box-shadow: inset 0 0 0 1px var(--pill-ring);
  transition: transform calc(0.12s * var(--spd)) cubic-bezier(0.3, 1.35, 0.5, 1);
  will-change: transform;
}
.rb svg {
  width: calc(var(--rail-s) * 0.46);
  height: calc(var(--rail-s) * 0.46);
}
.rb.f {
  background: var(--acc);
  color: var(--acc-ink);
  transform: scale(1.1);
}

#shelf {
  position: absolute;
  left: 0;
  right: 0;
  top: var(--name-y);
  height: 120px;
  padding: 0 var(--name-x);
  text-align: var(--name-a);
  display: var(--name-d);
  z-index: 5;
}
#name {
  font-size: calc(92px * var(--fs) * var(--name-s));
  font-weight: 700;
  letter-spacing: -0.028em;
  line-height: 1.05;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* the view clips rows as they scroll up under the shelf */
#view {
  position: absolute;
  left: 0;
  top: var(--view-top);
  width: 1920px;
  height: calc(1080px - var(--view-top));
  overflow: hidden;
  z-index: 2;
  transition: transform calc(0.6s * var(--spd)) ease;
}
/* while a trailer plays the apps move down a little, out of the video's way; they come back when the focus moves */
.trl-play #view {
  transform: translateY(120px);
}
#scroll {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: calc(1080px - var(--view-top));
  transition: transform calc(0.3s * var(--spd)) ease-out;
  will-change: transform;
}
#dock {
  position: absolute;
  left: var(--dock-l);
  right: var(--dock-r);
  top: var(--dock-t);
  bottom: var(--dock-b);
  transform: var(--dock-tx);
  display: flex;
  z-index: 4;
  padding: var(--dock-pad);
  border-radius: calc(var(--dock-rad) + var(--dock-pad));
  background: rgba(255, 255, 255, var(--dock-panel));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, calc(var(--dock-panel) * 1.4));
}
#dock > * + * {
  margin-left: var(--dock-gap);
}
#grid {
  position: absolute;
  left: var(--grid-l);
  top: var(--grid-t);
  width: var(--grid-w);
  display: grid;
  grid-template-columns: repeat(var(--cols), 1fr);
  gap: var(--gap-y) var(--gap-x);
}
/* an overlay grid: hidden until the focus moves down into it, then dark layer + grid over the screen above the dock */
[data-grid="overlay"] #grid {
  z-index: 3;
  opacity: 0;
  pointer-events: none;
  transition: opacity calc(0.22s * var(--spd)) linear;
}
[data-grid="overlay"].grid-open #grid {
  opacity: 1;
  pointer-events: auto;
}
[data-grid="overlay"] #scroll::before,
[data-grid="push"] #scroll::before {
  content: "";
  position: absolute;
  left: 0;
  top: -1600px;
  width: 1920px;
  height: 4400px;
  z-index: 2;
  opacity: 0;
  pointer-events: none;
  background: rgba(var(--night-rgb), var(--ov-dim));
  transition: opacity calc(0.22s * var(--spd)) linear;
}
[data-grid="overlay"].grid-open #scroll::before,
[data-grid="push"].grid-open #scroll::before {
  opacity: 1;
}
/* push: the grid sits under the dock; focusing it scrolls the dock up and fades the grid in */
[data-grid="push"] #grid {
  z-index: 3;
  opacity: 0;
  pointer-events: none;
  transition: opacity calc(0.25s * var(--spd)) linear;
}
[data-grid="push"].grid-open #grid {
  opacity: 1;
  pointer-events: auto;
}
/* every row of tiles centred, also a last row that is not full */
[data-galign="center"] #grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
}
[data-galign="center"] #grid .tile {
  width: var(--tile-w);
}
.tile::after {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  border-radius: inherit;
  pointer-events: none;
  opacity: var(--gloss);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0) 46%, rgba(0, 0, 0, 0.24));
}

.tile {
  --c: 74, 84, 112;
  --b: 20, 22, 27;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  will-change: transform;
  background: rgb(var(--b));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, var(--tile-border));
  transition: transform calc(0.12s * var(--spd)) cubic-bezier(0.3, 1.35, 0.5, 1);
}
.snap .tile,
.snap .pill,
.snap .rb {
  transition: none;
} /* held arrow key: follow the focus without animating each step */
.tile.fill {
  overflow: hidden;
}
.tile.fill img {
  object-fit: fill;
}
.tile.press {
  transform: scale(0.96) !important;
  transition-duration: calc(0.06s * var(--spd));
}
.tile.launching {
  opacity: 0.82;
}
.tile img {
  object-fit: contain;
}
.tile svg {
  fill: none;
  stroke: var(--ink);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.9;
}
.tile .t {
  font-size: calc(26px * var(--fs));
  font-weight: 600;
  padding: 12px;
  text-align: center;
  line-height: 1.15;
  opacity: 0.9;
}
/* The focus ring is a pseudo-element with its own radius: Chromium before 94 draws an outline as a rectangle, not around rounded corners. */
.tile.f {
  z-index: 3;
  box-shadow: 0 24px 36px rgba(0, 0, 0, 0.6);
}
.tile.f::before {
  content: "";
  position: absolute;
  pointer-events: none;
  left: calc(-1 * (var(--ring-off) + var(--ring-w)));
  top: calc(-1 * (var(--ring-off) + var(--ring-w)));
  right: calc(-1 * (var(--ring-off) + var(--ring-w)));
  bottom: calc(-1 * (var(--ring-off) + var(--ring-w)));
  border: var(--ring-w) solid var(--focus);
  border-radius: calc(var(--tile-r) + var(--ring-off) + var(--ring-w));
}
#dock .tile.f::before {
  border-radius: calc(var(--dock-rad) + var(--ring-off) + var(--ring-w));
}
/* a tile that crops its picture (overflow: hidden) would cut the ring off: it gets a ring that sits against the tile */
.tile.fill.f::before {
  display: none;
}
.tile.fill.f {
  box-shadow:
    0 0 0 var(--ring-w) var(--focus),
    0 24px 36px rgba(0, 0, 0, 0.6);
}
#dock .tile {
  width: var(--dock-w);
  height: var(--dock-h);
  border-radius: var(--dock-rad);
}
#dock .tile img {
  height: 56%;
  max-width: 46%;
}
#dock .tile svg {
  width: 96px;
  height: 96px;
}
#dock .tile.f {
  transform: translateY(var(--dock-lift)) scale(var(--dock-fs));
}
#grid .tile {
  height: var(--tile-h);
  border-radius: var(--tile-r);
}
#grid .tile img {
  width: 64%;
  height: 64%;
}
#grid .tile svg {
  width: 64px;
  height: 64px;
}
#grid .tile.f {

  return !!m && +m[1] < 79;
})();
function setHtml(el, h) {
  if (!OLDGPU || !el.parentNode) {
    el.innerHTML = h;
    return el;
  }
  var n = el.cloneNode(false);
  n.innerHTML = h;
  el.parentNode.replaceChild(n, el);
  return n;
}
function openMenu(title, items) {
  trailerStop();
  stack.push({ title: title, items: items, idx: 0 });
  drawMenu();
}
function closeMenus() {
  stack = [];
  if (ovEl) {
    ovEl.remove();
    ovEl = null;
  }
}
function backMenu() {
  stack.pop();
  if (stack.length) drawMenu();
  else closeMenus();
}
function drawMenu() {
  var m = stack[stack.length - 1],
    N = 8,
    start = Math.max(0, Math.min(m.idx - 3, m.items.length - N));
  if (!ovEl) {
    ovEl = document.createElement('div');
    ovEl.id = 'ov';
    document.body.appendChild(ovEl);
  }
  var h = '<div class="panel"><h2></h2><div class="more">' + (start > 0 ? '▲' : '') + '</div>';
  for (var i = start; i < Math.min(m.items.length, start + N); i++) {
    var it = m.items[i];
    h +=
      '<div class="row' +
      (i === m.idx ? ' f' : '') +
      (it.dim ? ' dim' : '') +
      '" data-i="' +
      i +
      '">' +
      (it.icon ? svg(it.icon) : '') +
      '<span class="lb"></span>' +
      (it.sub ? '<span class="st"></span>' : '') +
      '</div>';
  }
  h += '<div class="more">' + (start + N < m.items.length ? '▼' : '') + '</div></div>';
  ovEl = setHtml(ovEl, h);
  ovEl.querySelector('h2').textContent = m.title;
  [].forEach.call(ovEl.querySelectorAll('.row'), function (row) {
    var it = m.items[+row.getAttribute('data-i')];
    row.querySelector('.lb').textContent = it.label;
    if (it.sub) row.querySelector('.st').textContent = it.sub;
    row.addEventListener('click', function () {
      m.idx = +row.getAttribute('data-i');
      if (it.hold) return;
      pickMenu();
    });
    if (it.hold) {
      row.addEventListener('mousedown', function () {
        m.idx = +row.getAttribute('data-i');
        holdStart(it);
      });
      row.addEventListener('mouseup', holdEnd);
      row.addEventListener('mouseleave', holdEnd);
    }
  });
}
/* a row with hold: ms runs only when OK is held that long; the row counts down, letting go early does nothing */
var holdIt = null,
  holdT = 0,
  holdIv = 0;
function holdStart(it) {
  if (holdIt) return;
  holdIt = it;
  var t0 = Date.now(),
    st = ovEl && ovEl.querySelector('.row.f .st');
  holdIv = setInterval(function () {
    if (st) st.textContent = t('keep holding OK') + ' ' + Math.max(1, Math.ceil((it.hold - (Date.now() - t0)) / 1000)) + ' s';
  }, 200);
  holdT = setTimeout(function () {
    clearInterval(holdIv);
    holdIt = null;
    it.fn();
  }, it.hold);
}
function holdEnd() {
  if (!holdIt) return;
  var it = holdIt;
  holdIt = null;
  clearTimeout(holdT);
  clearInterval(holdIv);
  var st = ovEl && ovEl.querySelector('.row.f .st');
  if (st) st.textContent = it.sub || '';
}
function pickMenu() {
  var m = stack[stack.length - 1],
    it = m.items[m.idx];
  if (it && it.fn) {
    var n = stack.length;
    it.fn();
    if (stack.length === n && !it.stay) closeMenus();
  }
}
function menuKey(k) {
  var m = stack[stack.length - 1];
  if (k === 38 && m.idx > 0) {
    m.idx--;
    drawMenu();
  } else if (k === 40 && m.idx < m.items.length - 1) {
    m.idx++;
    drawMenu();
  } else if (k === 13) {
    if (m.items[m.idx] && m.items[m.idx].hold) holdStart(m.items[m.idx]);
    else pickMenu();
  } else if (k === 461 || k === 27 || k === 8) backMenu();
  else return false;
  return true;
}

function runningItems(list) {

  var items = list.map(function (a) {
    return {
      label: a.title,

      stay: true,
      fn: function () {
        closeRunning(list, [a.id]);

    };
  });
  if (list.length > 1)
    items.push({
      label: t('Close all'),
      stay: true,
      fn: function () {
        closeRunning(
          list,
          list.map(function (a) {
            return a.id;

}
/* the app manager's running list lags by seconds after a close, so the rows go at once instead of after a new reading */
function closeRunning(list, ids) {
  var m = stack[stack.length - 1],
    left = list.filter(function (a) {
      return ids.indexOf(a.id) < 0;
    });
  api('/api/running/close', ids.length > 1 ? { all: true } : { id: ids[0] }).then(
    function (x) {
      if (!x || x.returnValue !== true) toast(t('Could not close'));
    },
    function () {
      toast(t('Could not close'));
    }
  );
  m.items = runningItems(left);
  m.idx = Math.min(m.idx, m.items.length - 1);
  drawMenu();

var renaming = false;
function renameInput(d) {
  closeMenus();
  renaming = true;
  var w = document.createElement('div');
  w.id = 'ren';
  w.innerHTML = '<div class="panel"><h2></h2><input id="ren-in" type="text" maxlength="30" autocomplete="off"><p></p></div>';
  w.querySelector('h2').textContent = t('Name for') + ' ' + (d.lgLabel || d.label || 'HDMI ' + d.port);
  w.querySelector('p').textContent = t('OK saves · Back cancels · empty brings back LG’s name');
  document.body.appendChild(w);
  var inp = w.querySelector('input');
  inp.value = d.lgLabel ? d.label : '';
  var done = function (save) {
    renaming = false;
    if (w.parentNode) w.parentNode.removeChild(w);
    if (!save) return;
    var names = {},
      v = inp.value.replace(/\s+/g, ' ').trim().slice(0, 30),
      k;
    for (k in cfg.inputNames || {}) names[k] = cfg.inputNames[k];
    if (v) names[d.appId] = v;
    else delete names[d.appId];
    cfg.inputNames = names;
    saveCfg();
    toast(v ? t('Saved') + ': ' + v : t('LG’s name is back'));
  };
  inp.addEventListener('keydown', function (e) {
    if (e.keyCode === 13) {
      e.preventDefault();
      done(true);
    } else if (e.keyCode === 461 || e.keyCode === 27) {
      e.preventDefault();
      done(false);
    }

  setTimeout(function () {
    inp.focus();
  }, 50);
}

/* ---------- layout ---------- */
function rebuild() {
  var by = {};
  apps.forEach(function (a) {
    by[a.id] = a;
  });
  var di = dockIds(),
    dock = di.map(function (i) {
      return by[i];
    });
  var rest = apps
    .filter(function (a) {
      return !isHidden(a.id) && di.indexOf(a.id) < 0;
    })
    .sort(byOrder);
  var oldE = rows[r] && rows[r][c],
    keep = oldE && oldE._a ? oldE._a.id : null;
  if (oldE) oldE.classList.remove('f');
  var dk = $('dock'),
    gd = $('grid'),
    bar = $('bar'),
    rl = $('rail');
  dk.textContent = '';
  gd.textContent = '';
  bar.textContent = '';
  rl.textContent = '';
  ri = -1;
  var d = dock.map(function (a) {
    var t = tile(a);
    dk.appendChild(t);
    fit(t, true);
    return t;
  });
  var g = rest.map(function (a) {
    var t = tile(a);
    gd.appendChild(t);
    fit(t, false);
    return t;
  });
  /* with the strip on the left (theme rail.show): Home, Antenna TV, Radio, your buttons and Theme on the strip (Live TV is among the
     apps, so it is left off), and only the Mode button in the top bar */
  railEls = TH.rail
    ? [
        { label: 'Home', icon: 'home', action: 'home', fixed: true },
        { label: 'Antenna TV', icon: 'antenna', app: 'com.webos.app.livetv', fixed: true },
        { label: 'Radio', icon: 'radio', action: 'radio', fixed: true },
      ]
        .concat(
          shownBar().filter(function (o) {
            return o.action !== 'live';
          })
        )
        .concat([{ label: 'Theme', icon: 'theme', action: 'theme', fixed: true }])
        .map(function (o) {
          var b = document.createElement('div');
          b.className = 'rb';
          b._o = o;
          b.innerHTML = svg(o.action === 'inputs' ? 'hdmi' : o.icon);
          hit(b);
          rl.appendChild(b);
          return b;
        })
    : [];
  var tb = (
    TH.rail
      ? [{ label: 'Mode', icon: 'mode', action: 'mode', fixed: true }]
      : shownBar().concat([{ label: 'Customise', icon: 'edit', action: 'customize', fixed: true }])
  ).map(function (o) {
    var p = document.createElement('div');
    p.className = 'pill';
    p._o = o;
    p.innerHTML = svg(o.icon) + '<span></span>';
    p.lastChild.textContent = barLabel(o);
    hit(p);
    bar.appendChild(p);
    return p;
  });
  rows = [tb, d.length ? d : tb];
  for (var i = 0; i < g.length; i += TH.cols) rows.push(g.slice(i, i + TH.cols));
  var nr = Math.min(r, rows.length - 1),
    nc = c;
  if (keep && tiles[keep]) {
    var p = posOf(tiles[keep]);
    if (p) {
      nr = p[0];
      nc = p[1];
    }
  }
  setFocus(nr, nc, true);
}

function load() {
  api('/api/apps')
    .then(function (x) {
      if (x.version && oldSvc(x.version) && !warned) {
        warned = true;
        toast('The service (' + x.version + ') is older than this launcher needs: update it in the CleanYourTV manager');
      }
      usage = x.usage || {};
      var rank = Object.keys(usage).sort(function (a, b) {
        return usage[b] - usage[a];
      });
      var sig = JSON.stringify([
        x.apps.map(function (a) {
          return a.id;
        }),
        x.config,
        rank,
      ]);
      if (sig === lastSig) return;
      lastSig = sig;
      apps = x.apps.map(function (a) {
        return { id: a.id, title: a.title };
      });
      cfg = x.config || {};
      applyTheme(cfg.theme);
      if (liveOn()) apps.push({ id: '__live', title: t('Live TV') });
      store();
      rebuild();
      if (!perfReady) {
        perfReady = true;
        perfMark('launcher ready ' + Math.round(performance.now()));
      }
    })
    .catch(function () {
      toast(t('Helper not reachable, retrying...'));
      setTimeout(load, 3000);
    });
}
/* ---------- trailers (manager > Trailers): while the focus rests on a streaming app, a popular film or series on it fills the screen
   behind Home: first its picture, title and a short description, then, TRL_WAIT after the focus arrived, its trailer, quietly. The
   service finds them (TMDB) and serves the player page; this only shows and removes them. The player is removed, not paused, whenever
   the focus moves or anything opens, so the TV's video pipeline is free for the app. ---------- */
var HERO_WAIT = 300 /* ms the focus rests before the picture comes: moving along the row does not flash every title */,
  TRL_WAIT = 2000 /* ms from the focus arriving to the trailer starting */,
  TRL_AGE = 6 * 3600 * 1000,
  trlT = 0,
  trlAt = 0,
  trlFor = '',
  trlFrame = null,
  trlCache = {},
  trlTurn = {};
function trailersOn() {
  return !!(cfg.trailers && cfg.trailers.enabled);
}
function trlRegion() {
  var m = /^[a-z]{2}-([A-Z]{2})/.exec(LOC);
  return m ? m[1] : '';
}
/* called on every focus change: a tile of the dock row (or of a grid that stays in view) shows a title, then its trailer */
function isStreaming(a) {
  return (
    a.id !== '__live' &&
    STREAMING.some(function (re) {
      return re.test(a.title);
    })
  );
}
function trailerFocus(e) {
  var a = e && e._a,
    id = a && !a.sys && (trailersOn() || isStreaming(a)) && (r === 1 || (!TH.push && !TH.overlay)) ? a.id : '';
  if (id && id === trlFor) return;
  trailerStop();
  if (!id) return;
  trlFor = id;
  trlAt = Date.now();
  trlT = setTimeout(function () {
    trailerLoad(a);
  }, HERO_WAIT);
}
function trailerLoad(a) {
  if (!trailersOn()) return trailerLogo(a);
  var c = trlCache[a.id];
  if (c && Date.now() - c.at < TRL_AGE) return trailerShow(a, c.items);
  api('/api/trailers/for?title=' + encodeURIComponent(a.title) + '&region=' + trlRegion() + '&lang=' + encodeURIComponent(LOC)).then(
    function (x) {
      var items = (x && x.items) || [];
      if (!(x && x.error)) trlCache[a.id] = { at: Date.now(), items: items };
      trailerShow(a, items);
    },
    function () {}
  );
}
/* the picture, the title and the description at once; the trailer when TRL_WAIT has passed since the focus arrived */
function trailerShow(a, items) {
  if (trlFor !== a.id) return;
  if (!items.length) return trailerLogo(a);
  var n = trlTurn[a.id] || 0,
    it = items[n % items.length];
  trlTurn[a.id] = n + 1;
  $('trl-bd').style.backgroundImage = it.backdrop ? 'url("' + it.backdrop + '")' : 'none';
  $('trl-t').textContent = it.title + (it.year ? ' (' + it.year + ')' : '');
  $('trl-o').textContent = it.overview || '';
  $('trl').classList.add('on');
  document.body.classList.add('hero');
  trlT = setTimeout(
    function () {
      trailerPlay(a, it);
    },
    Math.max(0, TRL_WAIT - (Date.now() - trlAt))
  );
}

  /* ---------- the player: one <video>, several streams per channel, tuning screen, recovery ---------- */
  /* One <video> element for the whole session: creating and destroying it on every channel change makes the TV rebuild its video plane. */

    if (video) return video;

    v.autoplay = true;

    function onPlaying() {
      clearTimeout(spinT);
      clearTimeout(stallT);

      layer('lv-tune', false);

        clearTimeout(playedT);

    v.addEventListener('playing', onPlaying);

      if (v.currentTime !== lastTime) {

      }

      layer('lv-spin', true);
      if (started) {
        clearTimeout(stallT);
        stallT = setTimeout(stalled, STALL_MS);

    v.addEventListener(
      'error',

  var full = {};

  function filterText() {

          fn: function () {
            M.open = false;
            layer('lv-menu', false);
            pickStream(i);
          },
        });
      });
    it.push({
      label: t('Statistics'),
      sub: t(stats ? 'On' : 'Off'),
      fn: function () {
        setStats(!stats);
        drawMenu();
      },
    });
    it.push({
      label: t('Close'),
      sub: '',
      fn: function () {
        M.open = false;
        layer('lv-menu', false);
      },
    });
    return it;
  }
  function drawMenu() {
    M.items = menuItems();
    if (M.i >= M.items.length) M.i = M.items.length - 1;
    var h = '<h3>' + lesc(byNum[cur].name) + '</h3>';
    for (var i = 0; i < M.items.length; i++)
      h +=
        '<div class="mrow' +
        (i === M.i ? ' f' : '') +
        '"><div class="ml">' +
        lesc(M.items[i].label) +
        '</div><div class="mv">' +
        lesc(M.items[i].sub) +
        '</div></div>';
    setHtml($('lv-menu'), h);
  }
  function openMenu() {
    M.open = true;
    M.i = 0;
    drawMenu();
    layer('lv-menu', true);
  }
  function menuKey(k) {
    if (k === 38) {
      if (M.i > 0) M.i--;
    } else if (k === 40) {
      if (M.i < M.items.length - 1) M.i++;
    } else if (k === 13) {
      M.items[M.i].fn();
      return;
    } else if (k === 405 || k === 461 || k === 27 || k === 8) {
      M.open = false;
      layer('lv-menu', false);
      return;
    }
    drawMenu();
  }

  /* statistics (Blue while watching): what the TV tells a web page about the picture */
  function statsText() {
    var v = video;
    if (!v) return '';
    var q = v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality() : null,
      ahead = 0;
    try {
      if (v.buffered && v.buffered.length) ahead = v.buffered.end(v.buffered.length - 1) - v.currentTime;
    } catch (e) {}
    return (
      (v.videoWidth ? v.videoWidth + '×' + v.videoHeight : 'no picture') +
      '\n' +
      t('buffer') +
      ' ' +
      ahead.toFixed(1) +
      ' s\n' +
      (q ? t('frames') + ' ' + q.totalVideoFrames + ', ' + t('dropped') + ' ' + q.droppedVideoFrames + '\n' : '') +
      t('Stream') +
      ' ' +
      (si + 1) +
      '/' +
      streams.length +
      (reloads ? '  (' + t('reloaded') + ')' : '')
    );
  }
  function setStats(on) {
    stats = on;
    clearInterval(statsT);
    layer('lv-stats', on);
    if (on) {
      $('lv-stats').textContent = statsText();
      statsT = setInterval(function () {
        $('lv-stats').textContent = statsText();
      }, 1000);
    }
  }

  function digit(d) {
    numBuf += d;
    if (numBuf.length > 5) numBuf = numBuf.slice(-5);
    $('lv-numin').textContent = numBuf;
    layer('lv-numin', true);
    clearTimeout(numT);
    numT = setTimeout(function () {
      var n = parseInt(numBuf, 10);
      numBuf = '';
      layer('lv-numin', false);
      if (byNum[n]) play(n);
      else showOsd();
    }, 1800);
  }
  function setup() {
    api('/api/live/pair', {}).then(function (p) {
      msg(
        '<b>' +
          t('Set up Live TV') +
          '</b><div>' +
          t('Open this address on your phone or computer:') +
          '</div><b>' +
          lesc(p.url) +
          '</b><div>' +
          t('and enter this code:') +
          '</div><b>' +
          lesc(p.code) +
          '</b><div class="small">' +
          t('Then paste your M3U playlist address. This page closes by itself.') +
          '</div>'
      );
      clearInterval(setupT);
      setupT = setInterval(function () {
        if (!o.on) {
          clearInterval(setupT);
          return;
        }
        api('/api/live/status').then(function (s) {
          if (s.configured) {
            clearInterval(setupT);
            boot();
          }
        });
      }, 2500);
    });
  }
  function facets() {
    function top(k) {
      var n = {};
      chans.forEach(function (c) {
        if (c[k]) n[c[k]] = (n[c[k]] || 0) + 1;
      });
      return Object.keys(n)
        .sort(function (a, b) {
          return n[b] - n[a] || (a < b ? -1 : 1);
        })
        .slice(0, 40);
    }
    fac = {
      cc: top('cc'),
      lang: top('lang'),
      q: ['SD', 'HD', 'FHD', '4K'].filter(function (q) {
        return chans.some(function (c) {
          return c.q === q;
        });
      }),
    };
  }
  function boot() {
    msg('<div>' + t('Loading channels...') + '</div>');
    api('/api/live/status')
      .then(function (s) {
        if (!s.configured) {
          setup();
          return;
        }
        var tries = 0;
        (function load() {
          if (!o.on) return;
          api('/api/live/channels').then(function (x) {
            if (!x.channels.length) {
              if (++tries > 40) {
                msg('<div>' + lesc(s.error || 'No channels') + '</div>');
                return;
              }
              setTimeout(load, 2000);
              return;
            }
            groups = x.groups;
            chans = x.channels.map(function (r) {
              return {
                num: r[0],
                id: r[1],
                name: r[2],
                group: r[3],
                logo: r[4],
                url: r[5],
                key: r[6] || '',
                cc: r[7] || '',
                lang: r[8] || '',
                q: r[9] || '',
                fl: r[10] || 0,
                cats: r[11] || (r[3] ? [r[3]] : []),
                alt: (r[12] || []).map(function (a) {
                  return { url: a[0], q: a[1] };
                }),
              };
            });
            byNum = {};
            byKey = {};
            chans.forEach(function (c) {
              byNum[c.num] = c;
              if (c.key) byKey[c.key] = c;
            });
            loaded = true;
            facets();
            var last = 0;
            try {
              last = parseInt(localStorage.getItem('live.last'), 10);
            } catch (e) {}
            api('/api/live/state')
              .then(
                function (st) {
                  S = { fav: st.fav || [], recent: st.recent || [], failed: st.failed || {} };
                },
                function () {}
              )
              .then(function () {
                layer('lv-msg', false);
                play(byNum[last] ? last : chans[0].num);
                if (guideNext) {
                  guideNext = false;
                  openList();
                }
              });
          });
        })();
      })
      .catch(function () {
        msg('<div>' + t('The helper is not reachable.') + '</div>');
        setTimeout(function () {
          if (o.on) boot();
        }, 3000);
      });
  }
  function step(d) {
    var i = chans.indexOf(byNum[cur]);
    i = (i + d + chans.length) % chans.length;
    play(chans[i].num, false, 180);
  }
  var guideNext = false;
  o.enter = function (guide) {
    o.on = true;
    guideNext = !!guide;
    $('lv').classList.add('on');
    if (loaded && byNum[cur]) {
      play(cur);
      if (guideNext) {
        guideNext = false;
        openList();
      }
    } else boot();
  };
  o.toggleGuide = function () {
    if (!loaded) return;
    if (L.open) closeList();
    else {
      M.open = false;
      layer('lv-menu', false);
      openList();
    }
  };
  o.exit = function () {
    o.on = false;
    closeList();
    M.open = false;
    layer('lv-menu', false);
    setStats(false);
    full = {};
    release();
    clearTimeout(osdT);
    clearTimeout(numT);
    clearTimeout(toastT);
    clearInterval(setupT);
    layer('lv-osd', false);
    layer('lv-numin', false);
    layer('lv-msg', false);
    layer('lv-spin', false);
    layer('lv-tune', false);
    layer('lv-toast', false);
    $('lv').classList.remove('on');
  };
  o.key = function (e) {
    var k = e.keyCode;
    if (searching) {
      /* the input has the keys; only Enter and Back are ours */
      if (k === 13) {
        e.preventDefault();
        endSearch(true);
      } else if (k === 461 || k === 27) {
        e.preventDefault();
        if (Q) endSearch(false);
        else endSearch(true);
      }
      return;
    }
    e.preventDefault();
    if (!loaded) {
      if (k === 461 || k === 27 || k === 8) o.exit();
      return;
    }
    if (FP.open) {
      filterKey(k);
      return;
    }
    if (M.open) {
      menuKey(k);
      return;
    }
    if (L.open) {
      var n7 = 7;
      if (k === 38) {
        if (L.ci > 0) L.ci--;
      } else if (k === 40) {
        if (L.ci < L.list.length - 1) L.ci++;
      } else if (k === 33 || k === 427) {
        L.ci = Math.max(0, L.ci - n7);
      } else if (k === 34 || k === 428) {
        L.ci = Math.min(L.list.length - 1, L.ci + n7);
      } else if (k === 37) {
        if (L.g > 0) {
          L.g--;
          L.list = listFor(L.g);
          L.ci = 0;
        }
      } else if (k === 39) {
        if (L.g < groups.length + 2) {
          L.g++;
          L.list = listFor(L.g);
          L.ci = 0;
        }
      } else if (k === 13) {
        if (L.list[L.ci]) {
          var n = L.list[L.ci].num;
          closeList();
          play(n);
          return;
        }
      } else if (k === 458) {
        closeList();
        return;
      } else if (k === 404) {
        toggleFav(L.list[L.ci]);
        return;
      } else if (k === 405) {
        FP.open = true;
        FP.i = 0;
        drawFilter();
        layer('lv-filter', true);
        return;
      } else if (k === 403) {
        startSearch();
        return;
      } else if (k === 461 || k === 27 || k === 8) {
        if (Q || F.cc || F.lang || F.q) {
          Q = '';
          F = { cc: '', lang: '', q: '' };
          relist();
          return;
        }
        closeList();
        return;
      } else if (k >= 48 && k <= 57) {
        closeList();
        digit(k - 48);
        return;
      } else return;
      drawList();
      fetchVisible();
      return;
    }
    if (k === 13) {
      if (failed) play(cur);
      else openList();
    } else if (k === 404) toggleFav(byNum[cur]);
    else if (k === 405) openMenu();
    else if (k === 406) setStats(!stats);
    else if (k === 38 || k === 33 || k === 427) step(1);
    else if (k === 40 || k === 34 || k === 428) step(-1);
    else if (k === 458) openList();
    else if (k === 457 || k === 37 || k === 39) showOsd();
    else if (k >= 48 && k <= 57) digit(k - 48);
    else if (k >= 96 && k <= 105) digit(k - 96);
    else if (k === 461 || k === 27 || k === 8) o.exit();
  };
  return o;
})();
/* first paint straight from the last known layout, then refresh from the helper */
try {
  var cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
  if (cached && cached.apps && cached.apps.length) {
    apps = cached.apps;
    cfg = cached.cfg || {};
    applyTheme(cfg.theme);
    usage = cached.usage || {};
    colors = cached.colors || {};
    rebuild();
    perfMark('launcher cached ' + Math.round(performance.now()));
  }
} catch (e) {}
load();
wantInputs();
api('/api/frontend-ok', { version: VERSION }).catch(function () {}); // lets the manager know an updated launcher started
</script></body></html>
