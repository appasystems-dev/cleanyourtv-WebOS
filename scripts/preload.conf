# What LG's preloader starts hidden while Home is up, so an app opens at once (read by scripts/preload.sh at every start of the TV).
# Edit these two lines for your TV: app ids separated by spaces (see them with: luna-send -n 1 -f
# luna://com.webos.service.preloadmanager/getPreloadPolicy '{}'). A file preload-add or preload-off in /media/developer/cleanyourtv on
# the TV replaces the line of the same name here, for that TV only. LG preloads at most five apps (maxPreloadApp), Home and inputs
# included, and only while memory allows: switch one off to make room for one you add.

# preloaded too: Disney+ (not on LG's list) and Netflix (on it, but switched off on some TVs)
PRELOAD_ADD="com.disney.disneyplus-prod netflix"

# not preloaded (they still open, only more slowly the first time): the browser, Amazon Prime Video, Miracast screen sharing, the
# voice app, and HDMI 2 (the input still works; switched off here to make room for Disney+ on a TV where HDMI 2 has cameras)
PRELOAD_OFF="com.webos.app.browser amazon com.webos.app.miracast com.webos.app.voice com.webos.app.hdmi2"
